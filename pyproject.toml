[project]
name = "ledgerlens"
version = "0.1.0"
description = "KPI root-cause engine: anomaly cohort x change ledger, verified by negative controls."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pydantic>=2.9",
    "streamlit>=1.39",
    "anthropic>=0.40",
    "plotly>=5.24",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
